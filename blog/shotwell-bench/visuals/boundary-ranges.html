   Halftone is the house image treatment. Dark carries the product,
   saturated fields carry the story. Light mode is a full inversion,
   not a tint. */

:root{
  --ground:#0B0B0F;
  --surface:#111116;
  --fg:#F5F2EB;
  --dim:rgba(245,242,235,.54);
  --faint:rgba(245,242,235,.32);
  --wire:rgba(245,242,235,.20);
  --wire-strong:rgba(245,242,235,.44);
  --hover:rgba(245,242,235,.07);

  --ember:#C96E2D;
  --amber:#E8B33A;
  --moss:#C6D2C0;
  --pass:#6FA88C;
  --accent-fail:#E5006E;

  /* halftone dot colour + polarity, read by the page scripts */
  --dot:#F5F2EB;

  --display:'Fraunces',Georgia,serif;
  --body:'Outfit',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --max:1180px;
  --ease:cubic-bezier(.16,1,.3,1);
}

[data-theme="light"]{
  --ground:#F5F2EB;
  --surface:#EDE9DF;
  --fg:#22222A;
  --dim:rgba(34,34,42,.62);
  --faint:rgba(34,34,42,.42);
  --wire:rgba(34,34,42,.16);
  --wire-strong:rgba(34,34,42,.38);
  --hover:rgba(34,34,42,.05);
  --dot:#22222A;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--ground);color:var(--fg);
  line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background-color .25s var(--ease),color .25s var(--ease)}
img,canvas{display:block;max-width:100%}
a{color:inherit}

.wrap{max-width:var(--max);margin:0 auto;padding:0 40px}

.tag{font-family:var(--mono);font-size:.6875rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim)}
.tag b{font-weight:400;color:var(--ember)}

/* ── sample-set chrome ── */
.samplebar{position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;gap:2px;align-items:center;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--wire);padding:8px 14px}
.samplebar a,.samplebar button{font-family:var(--mono);font-size:.6875rem;
  letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--dim);
  padding:6px 12px;border-radius:6px;background:none;border:0;cursor:pointer}
.samplebar a:hover,.samplebar button:hover{color:var(--fg);background:var(--hover)}
.samplebar a[aria-current]{color:var(--ground);background:var(--ember)}
.samplebar .sb-label{font-family:var(--mono);font-size:.6875rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin-right:10px;padding-left:4px}
.samplebar .sb-spacer{flex:1}
#themeToggle{border:1px solid var(--wire)}
/* samplebar compensation removed in production */

:focus-visible{outline:2px solid var(--ember);outline-offset:3px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:720px){
  .wrap{padding:0 22px}
  .samplebar .sb-label{display:none}
}

:root{--reference:#327f9c;--accepted:#2a865c;--rejected:#af464c}
[data-theme="light"]{--reference:#257fa5;--accepted:#147b4b;--rejected:#be343b}
.choices{width:max-content;max-width:100%;gap:24px;margin:0 0 24px;border:0;border-bottom:1px solid var(--wire);border-radius:0;overflow:visible}
.choices button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 0 9px;letter-spacing:0;background:none;color:var(--dim);font:500 12px/1.3 var(--mono);white-space:nowrap}
.choices button+button{border-left:0}

.choices button[aria-pressed=true]{border-bottom-color:var(--reference);background:none;color:var(--fg)}
.transition{font:12px/1.5 var(--mono);color:var(--dim)}

.timeline-track::after{background:var(--fg);opacity:.8}
.context-segment,.context-segment.reference,.context-segment.focus-good,.context-segment.focus-bad{background:transparent;border:2px solid #70bdd9;color:var(--fg)}
[data-theme="light"] .context-segment,[data-theme="light"] .context-segment.reference,[data-theme="light"] .context-segment.focus-good,[data-theme="light"] .context-segment.focus-bad{background:transparent;border-color:#145c79;color:var(--fg)}
.context-segment{border-radius:5px;transform:translateX(8px);padding:5px 8px;font:500 13px/20px var(--mono)}
.timeline-ruler{margin-bottom:30px}

.context-segment{z-index:2}
#rows>.timeline-row:first-child .band::before{content:'Acceptable range';position:absolute;top:-22px;left:50%;padding:0 4px;background:var(--ground);color:var(--reference);font:500 10px/1.4 var(--mono);white-space:nowrap;transform:translateX(-50%)}
.prediction{background:var(--accepted)}
.prediction.bad{background:var(--rejected)}
.prediction::before{top:-22px;left:50%;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accepted);color:#fff;font:700 14px/1 var(--body);transform:translateX(-50%)}
.prediction.bad::before{background:var(--rejected);color:#fff}
.range-bracket{border-left:2px solid var(--reference)}
.timeline-name{font:12px/1.4 var(--mono)}
.comparison-note{font:300 18px/1.8 var(--body)}
.source-note{color:var(--dim);font:11px/1.6 var(--mono)}
.document{padding:0;max-width:none}html,body{overflow-y:hidden}body{transition:none}

didate_reference_indices": [3], "status": "hit", "reason": null, "segments": [{"start": 8.15, "end": 11.2, "description": "pass pitcher from left hand to right hand, pick up pitcher with right hand"}, {"start": 11.2, "end": 13.2, "description": "hold pitcher with right hand, reposition glass on table with left hand"}]}], "video": "pitcher-pickup.mp4", "referenceTime": 11.9, "referenceSegments": [{"start": 8.05, "end": 11.9, "description": "Pick up the pitcher with the right hand."}, {"start": 11.9, "end": 13.158144, "description": "[Slide left / push] a glass with the left hand. Hold the pitcher in the right hand."}]}, {"kind": "tight", "title": "Finishing the pour", "transition": "Pour water into the glass \u2192 place the pitcher", "episode": "wgo-bench-homer_1", "number": 1, "start": 18.5, "end": 22.5, "minimum": 20.43, "maximum": 20.8, "points": [{"model": "astra", "time": 20.5, "description": "Pour water from the pitcher into a glass with the right hand and steady the glass with the left hand.", "reference_index": 7, "candidate_reference_indices": [7], "status": "hit", "reason": null, "segments": [{"start": 13.875, "end": 20.5, "description": "Pour water from the pitcher into a glass with the right hand and steady the glass with the left hand."}, {"start": 20.5, "end": 21.88, "description": "Place the pitcher on the table with the right hand."}, {"start": 21.88, "end": 26.38, "description": "Turn the pitcher lid with the right hand and steady the pitcher with the left hand."}]}, {"model": "qwen", "time": 20.88, "description": "Pour water from the pitcher into the glass with the right hand.", "reference_index": null, "candidate_reference_indices": [], "status": "extra", "reason": "outside_all_ranges", "segments": [{"start": 18.0, "end": 20.0, "description": "Place the glass on the table with the left hand."}, {"start": 20.0, "end": 20.88, "description": "Pour water from the pitcher into the glass with the right hand."}, {"start": 20.88, "end": 21.88, "description": "Place the pitcher on the table with the right hand."}, {"start": 21.88, "end": 26.88, "description": "Screw the lid on the pitcher with the right hand."}]}, {"model": "sonnet", "time": 21.0, "description": "Place the pitcher on the table with the right hand and hold the glass in the left hand.", "reference_index": null, "candidate_reference_indices": [], "status": "extra", "reason": "outside_all_ranges", "segments": [{"start": 13.9, "end": 21.0, "description": "Place the pitcher on the table with the right hand and hold the glass in the left hand."}, {"start": 21.0, "end": 22.0, "description": "Reach toward the pitcher lid with the right hand and the left hand."}, {"start": 22.0, "end": 26.2, "description": "Unscrew the lid of the pitcher with the right hand and steady the pitcher with the left hand."}]}], "video": "pour-finish.mp4", "referenceTime": 20.7, "referenceSegments": [{"start": 14.75, "end": 20.7, "description": "Pour water into the glass with the right hand."}, {"start": 20.7, "end": 21.8, "description": "Place the jug on the table with the right hand."}, {"start": 21.8, "end": 26.3, "description": "Twist the jug lid with the right hand. Steady the jug with the left hand."}]}];

const names={astra:'GPT-6 Astra',sonnet:'Claude Sonnet 5.5',flora:'NVIDIA FLORA',qwen:'Qwen3-VL235B'};
const $=id=>document.getElementById(id),video=$('video');let active;

function select(i){active=examples[i];const e=active;video.pause();video.src=e.video;video.playbackRate=.5;document.querySelector('.timeline').dataset.kind=e.kind;document.querySelectorAll('.choices button').forEach((b,n)=>b.setAttribute('aria-pressed',n===i));$('title').textContent=e.title;$('transition').textContent=e.transition;$('episode').textContent=`Episode ${e.number} · ${e.episode} · ${e.start}–${e.end}s`;$('ruler').innerHTML=[0,1,2,3,4].map(n=>`<span>${e.start+n}</span>`).join('');$('rows').replaceChildren();const pc=t=>(t-e.start)/4*100;
for(const point of [null,...e.points]){const row=document.createElement('div');row.className='timeline-row';const label=document.createElement('span');label.className='timeline-name';label.textContent=point?names[point.model]:'Reference';const track=document.createElement('div');track.className='timeline-track';track.tabIndex=0;track.setAttribute('aria-label',label.textContent+' timeline');

const band=document.createElement('span');band.className='band';band.style.left=pc(e.minimum)+'%';band.style.width=(e.maximum-e.minimum)/4*100+'%';track.append(band);const mark=document.createElement(point?'button':'span');mark.className=point?'prediction'+(point.status==='hit'?'':' bad'):'range-bracket';mark.style.left=pc(point?point.time:e.referenceTime)+'%';if(point){mark.dataset.symbol=point.status==='hit'?'✓':'×';mark.setAttribute('aria-label',`${names[point.model]} boundary ${point.time}s`);mark.innerHTML=`<span class="prediction-label">${point.time.toFixed(3)}s</span>`;mark.onclick=ev=>{ev.stopPropagation();video.currentTime=point.time-e.start;update()};}track.append(mark);track.onclick=ev=>{const rect=track.getBoundingClientRect();video.currentTime=Math.max(0,Math.min(4,(ev.clientX-rect.left)/rect.width*4));update()};track.onkeydown=ev=>{if(['ArrowLeft','ArrowRight'].includes(ev.key)){ev.preventDefault();video.currentTime=Math.max(0,Math.min(4,video.currentTime+(ev.key==='ArrowRight'?.125:-.125)));update()}};row.append(label,track);$('rows').append(row);}
$('explanation').textContent=e.kind==='wide'?'Astra, Sonnet and FLORA place this boundary at different times. All three fall within the accepted range.':'Astra lands inside the accepted window. Qwen and Sonnet place their boundaries too late.';history.replaceState(null,'','#'+e.kind);update();}
function update(){document.querySelectorAll('.timeline-track').forEach(t=>t.style.setProperty('--playhead',Math.min(100,video.currentTime/4*100)+'%'))}video.ontimeupdate=update;function tick(){if(!video.paused)update();requestAnimationFrame(tick)}tick();select(location.hash==='#tight'?1:0);
