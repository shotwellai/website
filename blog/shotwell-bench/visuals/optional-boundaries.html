   Halftone is the house image treatment. Dark carries the product,

:root{
  --ground:#0B0B0F;
  --surface:#111116;
  --fg:#F5F2EB;
  --dim:rgba(245,242,235,.54);
  --faint:rgba(245,242,235,.32);
  --wire:rgba(245,242,235,.20);
  --wire-strong:rgba(245,242,235,.44);
  --hover:rgba(245,242,235,.07);

  --ember:#C96E2D;
  --amber:#E8B33A;
  --moss:#C6D2C0;
  --pass:#6FA88C;
  --accent-fail:#E5006E;

  /* halftone dot colour + polarity, read by the page scripts */
  --dot:#F5F2EB;

  --display:'Fraunces',Georgia,serif;
  --body:'Outfit',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --max:1180px;
  --ease:cubic-bezier(.16,1,.3,1);
}

[data-theme="light"]{
  --ground:#F5F2EB;
  --surface:#EDE9DF;
  --fg:#22222A;
  --dim:rgba(34,34,42,.62);
  --faint:rgba(34,34,42,.42);
  --wire:rgba(34,34,42,.16);
  --wire-strong:rgba(34,34,42,.38);
  --hover:rgba(34,34,42,.05);
  --dot:#22222A;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--ground);color:var(--fg);
  line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background-color .25s var(--ease),color .25s var(--ease)}
img,canvas{display:block;max-width:100%}
a{color:inherit}

.wrap{max-width:var(--max);margin:0 auto;padding:0 40px}

.tag{font-family:var(--mono);font-size:.6875rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim)}
.tag b{font-weight:400;color:var(--ember)}

/* ── sample-set chrome ── */
.samplebar{position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;gap:2px;align-items:center;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--wire);padding:8px 14px}
.samplebar a,.samplebar button{font-family:var(--mono);font-size:.6875rem;
  letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--dim);
  padding:6px 12px;border-radius:6px;background:none;border:0;cursor:pointer}
.samplebar a:hover,.samplebar button:hover{color:var(--fg);background:var(--hover)}
.samplebar a[aria-current]{color:var(--ground);background:var(--ember)}
.samplebar .sb-label{font-family:var(--mono);font-size:.6875rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin-right:10px;padding-left:4px}
.samplebar .sb-spacer{flex:1}
#themeToggle{border:1px solid var(--wire)}
/* samplebar compensation removed in production */

:focus-visible{outline:2px solid var(--ember);outline-offset:3px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:720px){
  .wrap{padding:0 22px}
  .samplebar .sb-label{display:none}
}

</style></head><body><main class="document"><figure class="comparison"><h3 class="comparison-title">Putting down the glass and sponge: split or group?</h3><video id="video" controls playsinline preload="auto" src="optional-boundaries.mp4"></video><figcaption><div class="timeline"><div class="timeline-ruler"><span>Seconds</span><span><span>103.0</span><span>104.3</span><span>105.55</span></span></div><div id="rows"></div></div><p class="comparison-note">Blue bands show acceptable ranges for required boundaries; yellow marks an optional split.</p></figcaption></figure></main><script>
const video=document.getElementById('video'),start=103,end=105.55,pc=t=>(t-start)/(end-start)*100;
const rows=[{name:'Shotwell-Bench Reference',reference:true,points:[103,103.99,105.55],labels:['Finish scrubbing','Put down glass and sponge','Next action'],note:'Major: 103.650–104.120s · Minor: 104.294–104.694s · Major: 105.200–105.630s'}, {name:'Claude Opus 5.5',points:[103,104,104.5,105.5],labels:['Finish scrubbing','Place glass','Place sponge','Continues beyond excerpt'],note:'✓ Required 104.000s · ✓ Optional 104.500s · ✓ Required 105.500s'}, {name:'GPT-6 Astra',points:[103,104,105.5],labels:['Finish scrubbing','Place glass and sponge together','Continues beyond excerpt'],note:'✓ Required 104.000s · Optional split omitted · ✓ Required 105.500s'}, {name:'GPT-6 Luna',points:[103,104.1,104.5,105.55],labels:['Scrub the cup with the sponge with the right hand and hold the cup with the left hand.','Place the sponge in the sink with the right hand.','Continue placing the sponge in the sink with the right hand.'],note:'✓ Required 104.100s · ✓ Optional 104.500s · ✕ Missing required boundary',missing:true}];
const shortLabels={'Finish scrubbing':'Finish scrub...','Put down glass and sponge':'Place glass + sponge...','Place glass':'Place glass...','Place sponge':'Place sponge...','Place glass and sponge together':'Place glass + sponge...','Scrub the cup with the sponge with the right hand and hold the cup with the left hand.':'Scrub cup...','Place the sponge in the sink with the right hand.':'Place sponge...','Continue placing the sponge in the sink with the right hand.':'Continue placing sponge...'};
for(const r of rows){const row=document.createElement('div');row.className='timeline-row'+(r.reference?'':' astra');const label=document.createElement('span');label.className='timeline-name';label.textContent=r.name;const plot=document.createElement('div');plot.className='timeline-plot';const track=document.createElement('div');track.className='timeline-track';track.tabIndex=0;track.setAttribute('aria-label',r.name+' timeline; use arrow keys to seek');const info=document.createElement('div');info.className='timeline-labels';const text=document.createElement('span');text.className='timeline-label';text.textContent=r.note;info.append(text);for(let i=0;i<r.points.length-1;i++){const a=r.points[i],b=r.points[i+1];const seg=document.createElement('span');seg.className='timeline-segment';seg.style.setProperty('--from',pc(a)+'%');seg.style.setProperty('--to',pc(b)+'%');seg.dataset.time=a;seg.textContent=shortLabels[r.labels[i]]||r.labels[i];if(!(r.missing&&i===r.points.length-2))seg.title=`${a.toFixed(3)}–${b.toFixed(3)}s: ${r.labels[i]}`;seg.onmouseenter=()=>text.textContent=seg.title||r.note;seg.onmouseleave=()=>text.textContent=r.note;track.append(seg);}for(const [a,b,t,minor] of [[103.65,104.12,103.99,false],[104.293718,104.693718,104.543718,true],[105.2,105.63,105.55,false]]){const band=document.createElement('span');band.className='range-window'+(minor?' optional':'');band.style.left=pc(Math.max(start,a))+'%';band.style.width=pc(Math.min(end,b))-pc(Math.max(start,a))+'%';track.append(band);if(r.reference){const mark=document.createElement('span');mark.className='boundary-guide'+(minor?' optional':'');mark.style.left=pc(t)+'%';track.append(mark);}}track.onclick=e=>{const rect=track.getBoundingClientRect();seek(start+(e.clientX-rect.left)/rect.width*(end-start));};track.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();seek(start+video.currentTime+(e.key==='ArrowRight'?.125:-.125));}};plot.append(track);row.append(label,plot);document.getElementById('rows').append(row);}
document.querySelectorAll('#rows .timeline-row').forEach((row, index) => {
  const data = rows[index];
  if (data.reference) return;
  const track = row.querySelector('.timeline-track');
  for (const time of data.points.slice(1, data.missing ? -1 : undefined)) {
    const mark = document.createElement('span');
    mark.className = 'boundary-verdict' + (time >= 105.45 ? ' near-end' : '');
    mark.style.left = `${pc(time)}%`;
    mark.setAttribute('role', 'img');
    mark.setAttribute('aria-label', `${data.name}: accepted boundary at ${time.toFixed(2)}s`);
    track.append(mark);
  }
  if (data.missing) {
    const mark = document.createElement('span');
    mark.className = 'boundary-verdict missing';
    mark.style.left = `${pc((105.2 + 105.63) / 2)}%`;
    mark.setAttribute('role', 'img');
    mark.setAttribute('aria-label', `${data.name}: missing required boundary in the 105.20–105.63s acceptable range`);
    track.append(mark);
  }
});
function seek(t){video.currentTime=Math.max(0,Math.min(end-start,t-start));update();}
function update(){if(video.currentTime>end-start){video.pause();video.currentTime=end-start;}document.querySelectorAll('.timeline-track').forEach(t=>t.style.setProperty('--playhead',Math.min(100,pc(start+video.currentTime))+'%'));}

const referenceRanges=document.querySelectorAll('#rows>.timeline-row:first-child .range-window');
referenceRanges[0]?.setAttribute('data-label','Acceptable range');
referenceRanges[1]?.setAttribute('data-label','Acceptable range');
referenceRanges[2]?.setAttribute('data-label','Acceptable range');
video.playbackRate=.5;video.ontimeupdate=update;video.addEventListener('play',()=>{if(video.currentTime>=end-start-.01)video.currentTime=0;});
function tick(){if(!video.paused)update();requestAnimationFrame(tick);}tick();
</script><script>
function reportSize(){parent.postMessage({type:'shotwell-visual-size',height:Math.ceil(document.body.getBoundingClientRect().height)},location.origin)}

addEventListener('message',event=>{if(event.source===parent&&event.origin===location.origin&&event.data.type==='shotwell-theme')document.documentElement.dataset.theme=event.data.theme});
