<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Browse reviewed Shotwell-WGO-Bench reference segments and their required and optional details.">
  <title>Shotwell-WGO-Bench Reference Annotations</title>
  <link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Outfit:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/tokens.css">
  <link rel="stylesheet" href="./reference.css">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('shotwell-sample-theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch (e) {}
  </script>
  <script src="./data.js" defer></script>
  <script src="./reference.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#reference-main">Skip to annotations</a>
  <header class="sitebar">
    <a class="site-logo" href="../../../" aria-label="Shotwell home">
      <img class="logo-dark" src="../../../brand/assets/SVG/shotwell-logo-horizontal-white.svg" alt="Shotwell">
      <img class="logo-light" src="../../../brand/assets/SVG/shotwell-logo-horizontal-black.svg" alt="Shotwell">
    </a>
    <div class="site-actions">
      <a href="../">Article</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle light and dark mode">&#9788;</button>
    </div>
  </header>

  <main class="reference-main" id="reference-main">
    <header class="reference-heading">
      <h1>Shotwell-WGO-Bench Reference Annotations</h1>
      <a class="download-csv" href="./shotwell-wgo-bench-reference-annotations.csv" download>Download CSV</a>
    </header>

    <div class="reference-layout">
      <aside class="episode-sidebar" aria-label="Episodes">
        <h2>Episodes</h2>
        <nav id="episode-list" class="episode-list" aria-label="Reference episodes"></nav>
      </aside>

      <section class="episode-stage" aria-label="Episode video and timeline">
        <div class="episode-ident">
          <div>
            <p class="episode-id" id="episode-id"></p>
            <h2 id="episode-task"></h2>
          </div>
          <span class="episode-duration" id="episode-duration"></span>
        </div>
        <video id="episode-video" controls playsinline preload="metadata" aria-label="Selected episode video"></video>

        <section class="current-detail" id="segment-detail" aria-live="polite" aria-label="Current segment details">
          <div class="detail-columns">
            <div class="detail-group required-group">
              <h4>Required details</h4>
              <ul id="required-list"></ul>
            </div>
            <div class="detail-group optional-group" id="optional-group">
              <h4>Optional details</h4>
              <ul id="optional-list"></ul>
              <p id="optional-empty" class="detail-empty">None</p>
            </div>
          </div>
        </section>

        <section class="timeline" aria-label="Episode boundary timeline">
          <div class="timeline-toolbar">
            <h3>Timeline</h3>
            <div class="boundary-legend" aria-label="Boundary types"><span class="legend-major">Major</span><span class="legend-minor">Optional split</span></div>
          </div>
          <div class="zoom-control-row">
            <span class="zoom-label" id="zoom-label"></span>
            <label class="pause-boundaries"><input id="pause-major-boundaries" type="checkbox" checked>Pause at major boundaries</label>
          </div>
          <div id="zoom-track" class="timeline-track zoom-track" role="slider" tabindex="0" aria-label="Seek within one-minute timeline" aria-valuemin="0">
            <div id="zoom-segments" class="timeline-segments"></div>
            <div id="zoom-selected-range" class="selected-range"></div>
            <div id="zoom-markers" class="boundary-markers"></div>
            <div id="zoom-playhead" class="playhead"></div>
          </div>
          <svg id="timeline-fan" class="timeline-fan" viewBox="0 0 1000 28" preserveAspectRatio="none" aria-hidden="true">
            <polygon id="fan-area" points="0,0 1000,0 1000,28 0,28"></polygon>
          </svg>
          <div id="full-track" class="timeline-track full-track" role="slider" tabindex="0" aria-label="Seek within full episode timeline" aria-valuemin="0">
            <div id="full-segments" class="timeline-segments"></div>
            <div id="full-selected-range" class="selected-range"></div>
            <div id="full-markers" class="boundary-markers"></div>
            <div id="full-window" class="full-window"></div>
            <div id="full-playhead" class="playhead"></div>
          </div>
          <div class="time-ruler" id="time-ruler" aria-hidden="true"></div>
        </section>
      </section>
    </div>

  </main>
</body>
</html>
