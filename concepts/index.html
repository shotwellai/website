<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shotwell marketing concepts</title>
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: 320px 1fr; background: #111114; color: #f5f5f5; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    aside { height: 100vh; overflow: auto; padding: 18px; border-right: 1px solid rgba(255,255,255,.14); background: #16161a; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .brand img { width: 34px; filter: invert(1); }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
    p { color: #b9bac3; line-height: 1.45; margin: 6px 0 18px; }
    .list { display: grid; gap: 8px; }
    button { width: 100%; text-align: left; border: 1px solid rgba(255,255,255,.12); background: #1f1f25; color: #f5f5f5; padding: 12px; cursor: pointer; }
    button:hover, button.active { background: #f5f5f5; color: #111114; }
    button span { display: block; font-size: 13px; font-weight: 800; }
    button small { display: block; margin-top: 5px; line-height: 1.35; color: inherit; opacity: .7; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.12); background: #111114; }
    .bar strong { font-size: 14px; }
    .bar a { color: #f5f5f5; border: 1px solid rgba(255,255,255,.2); padding: 8px 10px; text-decoration: none; font-size: 12px; }
    .stage { display: grid; grid-template-rows: auto 1fr; min-width: 0; height: 100vh; }
    iframe { width: 100%; height: 100%; border: 0; background: white; }
    @media (max-width: 820px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { height: auto; max-height: 44vh; border-right: 0; border-bottom: 1px solid rgba(255,255,255,.14); } .stage { height: 56vh; } }
  </style>
</head>
<body>
  <aside>
    <div class="brand"><img src="../shotwell-logo.png" alt=""><div><h1>Shotwell field-note concepts</h1><p>Browse the current marketing page plus five directions branching from the field notes approach.</p></div></div>
    <div class="list" id="list"></div>
  </aside>
  <main class="stage">
    <div class="bar"><strong id="title">Current site</strong><a id="open" href="../index.html" target="_blank" rel="noopener">Open full page</a></div>
    <iframe id="frame" title="Selected concept" src="../index.html"></iframe>
  </main>
  <script>
    const pages = [
      {
            "file": "../index.html",
            "title": "Current site",
            "note": "The current live marketing page for comparison."
      },
      {
            "file": "01-field-log.html",
            "title": "Field Log",
            "note": "Current Shotwell copy in a notebook and annotation-card treatment."
      },
      {
            "file": "02-qa-dossier.html",
            "title": "QA Dossier",
            "note": "The same hero, proof, outcomes, and demo as a robotics QA case file."
      },
      {
            "file": "03-lab-ledger.html",
            "title": "Lab Ledger",
            "note": "Current content recast as a structured annotation ledger."
      },
      {
            "file": "04-operator-debrief.html",
            "title": "Operator Debrief",
            "note": "The original message focused through operator feedback and QA notes."
      },
      {
            "file": "05-expedition-journal.html",
            "title": "Expedition Journal",
            "note": "The live Shotwell story in a high-contrast field-journal direction."
      }
];
    const list = document.getElementById('list');
    const frame = document.getElementById('frame');
    const title = document.getElementById('title');
    const open = document.getElementById('open');
    function select(page, button) {
      document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      button.classList.add('active');
      frame.src = page.file;
      title.textContent = page.title;
      open.href = page.file;
    }
    pages.forEach((page, index) => {
      const button = document.createElement('button');
      button.innerHTML = '<span>' + String(index).padStart(2, '0') + ' / ' + page.title + '</span><small>' + page.note + '</small>';
      button.addEventListener('click', () => select(page, button));
      list.appendChild(button);
      if (index === 0) button.classList.add('active');
    });
  </script>
</body>
</html>
