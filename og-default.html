<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shotwell OG Image</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: #d7c7a9;
      color: #201c17;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      position: relative;
      display: grid;
      align-content: center;
      width: 1116px;
      height: 546px;
      padding: 62px 68px;
      border: 2px solid #3d3428;
      background: #efe5ce;
      box-shadow: 14px 16px 0 rgba(32, 28, 23, .18);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 58px;
      color: #201c17;
      font-weight: 800;
    }
    .brand img { width: 92px; height: 136px; object-fit: contain; }
    .brand span {
      font-size: 64px;
      line-height: 1;
      letter-spacing: -.03em;
    }
    h1 {
      max-width: 900px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 92px;
      font-weight: 400;
      line-height: .94;
      letter-spacing: -.045em;
    }
    p {
      max-width: 760px;
      margin: 30px 0 0;
      color: #4a4034;
      font-size: 30px;
      line-height: 1.34;
    }
    .rule {
      position: absolute;
      right: 68px;
      bottom: 62px;
      width: 220px;
      height: 1px;
      background: #9b3328;
    }
  </style>
</head>
<body>
  <main class="card">
    <section>
      <div class="brand" aria-label="Shotwell">
        <img src="shotwell-logo.png" alt="">
        <span>Shotwell.</span>
      </div>
      <h1>Annotations for robotics data</h1>
      <p>Shotwell provides fast, accurate and dense annotations for robotics training data.</p>
    </section>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
