<!DOCTYPE html>
<html lang="en" data-theme="dark" data-palette="board">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample — Talk to us</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Outfit:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  [data-palette="board"]{--acc:#EFB702;--on-acc:#0C0C0E}

  .brandbar{position:sticky;top:41px;z-index:40;display:flex;align-items:center;
    justify-content:space-between;gap:20px;padding:14px 40px;
    background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--wire)}
  .brandbar img{height:24px;width:auto}
  .navlinks{display:flex;gap:26px;align-items:center}
  .navlinks a{font-size:.875rem;color:var(--dim);text-decoration:none}
  .navlinks a:hover,.navlinks a[aria-current]{color:var(--fg)}
  .cta{background:var(--acc);color:var(--on-acc);padding:9px 17px;font-size:.8125rem;
    font-weight:500;text-decoration:none}
  .cta small{font-size:.75em;font-weight:400;opacity:.75}

  .page{padding:64px 0 110px}
  .card{position:relative;background:var(--surface);border:1px solid var(--wire);
    padding:56px 64px 52px;overflow:hidden;max-width:688px;margin:0 auto}
  .kicker{font-family:var(--mono);font-size:.625rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--dim);margin-bottom:34px;display:block}
  h1{font-family:var(--display);font-weight:300;font-size:clamp(2.1rem,4.4vw,3.3rem);
    line-height:1.06;letter-spacing:-.015em;max-width:15ch}
  h1 em{font-style:italic;color:var(--dim)}
  .lede{text-align:center;padding-bottom:44px}
  .lede h1{max-width:none}
  .lede p{margin:14px auto 0;color:var(--dim);font-weight:500;font-size:1.125rem}

  form{margin-top:0;display:grid;gap:24px}
  .field label{font-family:var(--body);font-size:.9375rem;font-weight:400;
    color:var(--fg);display:block;margin-bottom:9px}
  input,textarea,select{width:100%;background:var(--ground);border:1px solid var(--wire);
    color:var(--fg);font-family:var(--body);font-weight:300;font-size:.9375rem;
    padding:12px 14px;outline:none;border-radius:0;
    transition:border-color .2s var(--ease)}
  input:focus,textarea:focus,select:focus{border-color:var(--acc)}
  select{appearance:none;-webkit-appearance:none;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
      linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;
    background-size:5px 5px;background-repeat:no-repeat}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:640px){.row2{grid-template-columns:1fr}}
  textarea{min-height:130px;resize:vertical}
  ::placeholder{color:var(--faint)}
  button{justify-self:start;background:var(--acc);color:var(--on-acc);border:0;
    padding:12px 24px;font-family:var(--body);font-size:.875rem;font-weight:500;
    cursor:pointer}
  button:hover{filter:brightness(1.06)}
  .alt{font-family:var(--mono);font-size:.625rem;letter-spacing:.1em;color:var(--faint)}
  .alt a{color:var(--dim)}

  footer{margin-top:72px;padding:26px 0 0;
    font-family:var(--mono);font-size:.625rem;letter-spacing:.1em;color:var(--faint);
    display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

  @media (max-width:820px){
    .brandbar{padding:12px 16px;flex-wrap:wrap}
    .navlinks{gap:14px} .navlinks a{font-size:.8125rem} .cta{padding:8px 12px}
    .card{padding:40px 26px 46px}
    }

  /* CTA pair: ghost secondary + filled primary; 24hr promise on wide screens */
  .navlinks .ghostcta{border:1px solid var(--wire-strong);padding:8px 15px;
    color:var(--fg);font-weight:500}
  .navlinks .ghostcta:hover{border-color:var(--acc)}
  .cta small{display:none;font-size:.75em;font-weight:400;opacity:.75}
  @media (min-width:1100px){.cta small{display:inline}}
</style>
</head>
<body>

<nav class="samplebar">
  <span class="sb-label">Samples</span>
  <a href="index.html">Index</a>
  <a href="demo.html">Demo</a>
  <a href="blog.html">Blog</a>
  <a href="hero-a.html">Hero A</a>
  <a href="hero-b.html">Hero B</a>
  <a href="hero-c.html">Hero C</a>
  <a href="press.html">Press</a>
  <a href="fields.html">Fields</a>
  <a href="palettes.html">Colour</a>
  <span class="sb-spacer"></span>
  <button id="themeToggle" type="button">Light</button>
</nav>

<div class="brandbar">
  <a href="demo.html"><img id="mark" src="../brand/assets/SVG/shotwell-logo-horizontal-white.svg" alt="Shotwell"></a>
  <div class="navlinks">
    <a href="https://demo.shotwell.ai/">Demo</a>
    <a href="blog.html">Blog</a>
    <a class="ghostcta" href="contact.html" aria-current="page">Talk to us</a>
    <a class="cta" href="#">Upload videos now <small>· 24 hr turnaround</small></a>
  </div>
</div>

<main class="page wrap">
  <header class="lede">
    <h1>We'd love to talk<em>.</em></h1>
    <p>Leave a note, and we will get back to you ASAP.</p>
  </header>

  <section class="card">

    <form id="f">
      <div class="field">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="company">Company</label>
        <input id="company" name="company" type="text" autocomplete="organization" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="msg">What would you like to discuss?</label>
        <textarea id="msg" name="msg" placeholder="The task, the robot, what you need labelled…" required></textarea>
      </div>
      <button type="submit">Send</button>
      <span class="alt">Or email <a href="mailto:hello@shotwell.ai">hello@shotwell.ai</a> directly.</span>
    </form>
  </section>

  <footer>
    <span>Shotwell — annotations for robotics data</span>
    <span>hello@shotwell.ai</span>
  </footer>
</main>

<script type="module">
import { init, isLight } from './assets/theme.js';

var mark=document.getElementById('mark');
function syncMark(){
  mark.src = isLight()
    ? '../brand/assets/SVG/shotwell-logo-horizontal-black.svg'
    : '../brand/assets/SVG/shotwell-logo-horizontal-white.svg';
}
init(); syncMark();
addEventListener('themechange',syncMark);

/* Submissions POST to the platform's contact endpoint, which forwards to
   the founders through the existing Resend admin-notification pipeline.
   Until that endpoint ships, fall back to composing the mail. */
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var g=function(id){return document.getElementById(id).value;};
  var payload={name:g('name'),company:g('company'),email:g('email'),
    message:g('msg')};
  var btn=document.querySelector('#f button');
  btn.disabled=true; btn.textContent='Sending…';
  try{
    var res=await fetch('https://app.shotwell.ai/api/contact',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)});
    if(!res.ok) throw new Error(res.status);
    btn.textContent='Sent — we’ll be in touch within a day';
  }catch(err){
    btn.disabled=false; btn.textContent='Send';
    var subject='Shotwell — '+payload.company;
    var body=payload.message+'\n\n— '+payload.name+', '+payload.company
      +' ('+payload.email+')';
    location.href='mailto:hello@shotwell.ai?subject='+encodeURIComponent(subject)
      +'&body='+encodeURIComponent(body);
  }
});
</script>
</body>
</html>
