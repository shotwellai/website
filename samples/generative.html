<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generative art studies — Shotwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Outfit:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#F5F2EB; --surface:#EDE9DF; --ink:#22222A;
    --dim:rgba(34,34,42,.62); --faint:rgba(34,34,42,.38); --wire:rgba(34,34,42,.16);
    --acc:#EFB702; --fail:#AF3261;
    --display:'Fraunces',Georgia,serif; --body:'Outfit',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  header{max-width:1240px;margin:0 auto;padding:72px 40px 40px}
  .tag{font-family:var(--mono);font-size:.6875rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  h1{font-family:var(--display);font-weight:300;font-size:clamp(2.4rem,5vw,3.8rem);line-height:1.05;letter-spacing:-.015em;margin:14px 0 18px}
  header p{max-width:60ch;color:var(--dim);font-size:1.0625rem;line-height:1.6}
  main{max-width:1240px;margin:0 auto;padding:0 40px 120px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
  figure{min-width:0;background:var(--surface);border:1px solid var(--wire)}
  .stage{position:relative;aspect-ratio:3/2;background:var(--ground);border-bottom:1px solid var(--wire);overflow:hidden}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%}
  .stage .corner{position:absolute;font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);pointer-events:none}
  .tl{top:14px;left:16px}
  .chip{background:var(--ground);padding:4px 8px;border:1px solid var(--wire)}.tr{top:14px;right:16px}.bl{bottom:12px;left:16px}.br{bottom:12px;right:16px}
  figcaption{padding:20px 22px 24px}
  figcaption h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:8px 0 8px}
  figcaption p{color:var(--dim);font-size:.9375rem;line-height:1.55}
  .wide{grid-column:1/-1}
  .wide .stage{aspect-ratio:1278/720}
  .strip{display:flex;gap:2px;padding:14px 22px 0;cursor:pointer}
  .strip span{position:relative;height:30px;background:var(--wire);font-family:var(--mono);font-size:.5625rem;
    letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:8px 6px 0;overflow:hidden;white-space:nowrap;min-width:0;text-overflow:clip}
  .strip span.on{background:var(--ink);color:var(--ground)}
  .strip span.fail.on{background:var(--fail)}
  .strip span i{position:absolute;left:0;bottom:0;height:2px;background:var(--acc)}
  .batch{grid-column:1/-1;display:flex;align-items:center;gap:16px;margin:36px 0 4px}
  .batch::after{content:'';flex:1;border-top:1px solid var(--wire)}
  .stage.dark{background:#121216}
  .stage.dark .corner{color:rgba(245,242,235,.45)}
  @media (max-width:820px){
    header{padding:48px 20px 28px}
    main{grid-template-columns:minmax(0,1fr);padding:0 20px 80px;gap:20px}
    .strip span{font-size:0;padding:0}
    .wide .corner.br{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="tag">Samples · generative studies</div>
  <h1>Art drawn by code, from robot data</h1>
  <p>Twelve studies. Each one draws a kind of data we annotate. Every frame is computed in the browser. No image files, no image models. Click a study to make a new variation.</p>
</header>

<main>
  <figure class="wide">
    <div class="stage"><canvas id="typewide"></canvas>
      <span class="corner tl chip">11b · Labels, full frame</span><span class="corner tr chip" id="tw-step">—</span><span class="corner br chip">fold-rubric.mp4 · 19.1 s · full frame</span></div>
    <div class="strip" id="tw-strip"></div>
    <figcaption><div class="tag">Real footage, as labels · full frame</div>
      <h2>Every frame, drawn with the name of its step</h2>
      <p>The whole hero clip, uncropped. Each letter is a pixel. The letters spell the subtask that the annotation gives that moment, so the words change at each boundary. Failed steps turn red. Click a step in the strip to jump to it.</p></figcaption>
  </figure>

  <figure>
    <div class="stage"><canvas id="envelope"></canvas>
      <span class="corner tl">01 · Envelope</span><span class="corner br">n = 64 demos</span></div>
    <figcaption><div class="tag">Gripper trajectories</div>
      <h2>Sixty-four ways to do one fold</h2>
      <p>Each line is one demonstration of the same pick, carry and place. The spread shows operator variance. The red lines drift out of the envelope and fail.</p></figcaption>
  </figure>

  <figure>
    <div class="stage"><canvas id="strata"></canvas>
      <span class="corner tl">02 · Strata</span><span class="corner br">8 subtasks · fold_clothing</span></div>
    <figcaption><div class="tag">Subtask segmentation</div>
      <h2>Every episode, cut into steps</h2>
      <p>Each row is one episode. The bands are the 8 real subtasks of the hero clip, from Pick up to Home. Hairlines join the same boundary across episodes. Red marks a failed step.</p></figcaption>
  </figure>

  <figure>
    <div class="stage"><canvas id="dotarm"></canvas>
      <span class="corner tl">03 · Dot matrix</span><span class="corner br">3-DOF · pick / place</span></div>
    <figcaption><div class="tag">Robot state</div>
      <h2>An arm made of dots</h2>
      <p>A three-joint arm moves through a pick and place. The arm is drawn as a dot grid, the way a low-resolution mask sees it. The joints carry their angle as a label.</p></figcaption>
  </figure>

  <figure>
    <div class="stage"><canvas id="hand"></canvas>
      <span class="corner tl">04 · Keypoints</span><span class="corner br">21 joints · ego</span></div>
    <figcaption><div class="tag">Egocentric hand pose</div>
      <h2>A grasp, frame by frame</h2>
      <p>Twenty-one hand keypoints close on an object and release it. Faint copies show earlier frames. The fingertips leave trails.</p></figcaption>
  </figure>

  <figure>
    <div class="stage"><canvas id="field"></canvas>
      <span class="corner tl">05 · Contact field</span><span class="corner br">3 grasp points</span></div>
    <figcaption><div class="tag">Contact points</div>
      <h2>Where the hands want to go</h2>
      <p>Particles move through a flow field toward three grasp points on a garment. The field shows where the contact happens across many episodes.</p></figcaption>
  </figure>

  <figure>
    <div class="stage"><canvas id="halftone"></canvas>
      <span class="corner tl chip">06 · Halftone</span><span class="corner tr chip" id="ht-step">—</span><span class="corner br chip">fold-rubric.mp4 · live</span></div>
    <figcaption><div class="tag">Real footage</div>
      <h2>The episode as a dot field</h2>
      <p>The real hero clip, redrawn as halftone dots at 24 frames per second. The label at the top right shows the current subtask from our annotation.</p></figcaption>
  </figure>
  <div class="batch tag">Batch 2</div>

  <figure>
    <div class="stage"><canvas id="ridges"></canvas>
      <span class="corner tl">07 · Ridges</span><span class="corner br">gripper speed · 40 eps</span></div>
    <figcaption><div class="tag">Velocity profiles</div>
      <h2>Forty episodes, stacked like a pulse</h2>
      <p>Each ridge is the gripper speed over one episode. The peaks are the moves between subtasks. The yellow ridge is the hero clip.</p></figcaption>
  </figure>

  <figure>
    <div class="stage"><canvas id="cloth"></canvas>
      <span class="corner tl">08 · Fold</span><span class="corner br" id="cloth-step">—</span></div>
    <figcaption><div class="tag">Deformable object</div>
      <h2>The fold, as a mesh</h2>
      <p>A garment as a 3D mesh. It folds in half, then in half again, then opens. The yellow edge is the part that moves.</p></figcaption>
  </figure>

  <figure>
    <div class="stage"><canvas id="rings"></canvas>
      <span class="corner tl">09 · Rings</span><span class="corner br">1 ring = 1 episode</span></div>
    <figcaption><div class="tag">Segmentation, radial</div>
      <h2>Episodes as tree rings</h2>
      <p>Each ring is one episode, and each arc is one subtask. The sweep line reads the dataset like a clock. Red arcs failed.</p></figcaption>
  </figure>

  <figure>
    <div class="stage dark"><canvas id="exposure"></canvas>
      <span class="corner tl">10 · Long exposure</span><span class="corner br">bimanual · L / R</span></div>
    <figcaption><div class="tag">Two arms, dark</div>
      <h2>A long exposure of two hands</h2>
      <p>Both end effectors leave light as they work, like a photo with the shutter open. The dark version, close to Pantheon.</p></figcaption>
  </figure>

  <figure>
    <div class="stage"><canvas id="typefield"></canvas>
      <span class="corner tl chip">11 · Type</span><span class="corner br chip">fold-rubric.mp4 · live</span></div>
    <figcaption><div class="tag">Real footage, as labels</div>
      <h2>The episode, written in its own labels</h2>
      <p>The hero clip redrawn with letters. The letters spell the current subtask, so the picture changes its words when the step changes.</p></figcaption>
  </figure>

  <figure>
    <div class="stage"><canvas id="contours"></canvas>
      <span class="corner tl">12 · Contours</span><span class="corner br">success rate · x vs θ</span></div>
    <figcaption><div class="tag">Policy evaluation</div>
      <h2>A map of where the policy succeeds</h2>
      <p>Contour lines of success rate across object position and angle. Dots are trials, crosses are failures. The yellow line is 90 percent.</p></figcaption>
  </figure>
</main>

<video id="src" muted loop playsinline preload="auto" style="display:none"></video>

<script type="module">
import { halftone } from './assets/halftone.js';

// Load the clip as a blob so a seek works on any static server.
{
  const v = document.getElementById('src');
  fetch('/fold-rubric.mp4').then(r => r.blob()).then(b => { v.src = URL.createObjectURL(b); v.play().catch(() => {}); });
}

const INK = '#22222A', GROUND = '#F5F2EB', ACC = '#EFB702', FAIL = '#AF3261';
const MONO = '500 10px "IBM Plex Mono", monospace';

// The real 8-subtask segmentation of fold-rubric.mp4 (from hero-pipeline.js).
const SEGMENTS = [
  { label: 'Pick up', start: 0, end: 1, fail: false },
  { label: 'Straighten', start: 1, end: 7, fail: true },
  { label: 'Fold right sleeve', start: 7, end: 10, fail: false },
  { label: 'Fold left sleeve', start: 10, end: 15, fail: true },
  { label: 'Fold first third', start: 15, end: 16, fail: false },
  { label: 'Fold second third', start: 16, end: 17, fail: false },
  { label: 'Stack', start: 17, end: 18, fail: false },
  { label: 'Home', start: 18, end: 19, fail: false },
];

// Seeded random, so a variation is stable until the user clicks.
function rng(seed) { return () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296); }

// Smooth 1-D noise from a few sines with random phases.
function wobble(r, n = 4) {
  const parts = Array.from({ length: n }, (_, i) => ({ f: (i + 1) * (0.6 + r()), p: r() * 6.283, a: 1 / (i + 1) }));
  return (t) => parts.reduce((s, q) => s + q.a * Math.sin(q.f * t * 6.283 + q.p), 0);
}

// 2-D value noise for the flow field.
function noise2(r) {
  const P = Array.from({ length: 512 }, () => r());
  const h = (x, y) => P[((x * 73 + y * 151) & 511 + 512) & 511];
  const s = (t) => t * t * (3 - 2 * t);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return a + (b - a) * s(xf) + (c - a) * s(yf) + (a - b - c + d) * s(xf) * s(yf);
  };
}

// Size a canvas to its box at device pixel ratio, and redo it on resize.
function setup(id, sketch) {
  const cv = document.getElementById(id), ctx = cv.getContext('2d');
  const state = { w: 0, h: 0, dpr: 1, seed: 7, t0: performance.now(), data: null };
  function size() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    Object.assign(state, { w: r.width, h: r.height, dpr });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    state.data = sketch.init ? sketch.init(state, rng(state.seed)) : null;
  }
  new ResizeObserver(size).observe(cv);
  cv.parentElement.addEventListener('click', () => { state.seed = (Math.random() * 1e9) | 0; state.t0 = performance.now(); size(); });
  let visible = false;
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(cv);
  function frame(now) {
    if (visible && state.w) sketch.draw(ctx, state, (now - state.t0) / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* 01 · Envelope: many demonstrations of one carry path. */
setup('envelope', {
  init(s, r) {
    const demos = Array.from({ length: 64 }, (_, i) => ({ wx: wobble(r), wy: wobble(r), amp: 0.5 + r(), fail: i < 6, speed: 0.85 + r() * 0.3 }));
    return { demos };
  },
  base(u, s) {
    // lift, carry over an arc, place
    const x = 0.12 + 0.76 * u;
    const y = 0.74 - 0.38 * Math.sin(Math.PI * u) ** 0.8;
    return [x * s.w, y * s.h];
  },
  draw(ctx, s, t) {
    ctx.fillStyle = GROUND; ctx.fillRect(0, 0, s.w, s.h);
    const cycle = 7, phase = (t % cycle) / (cycle - 1.5), N = 140;
    // pick and place marks
    for (const u of [0, 1]) {
      const [x, y] = this.base(u, s);
      ctx.strokeStyle = INK; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y); ctx.moveTo(x, y - 9); ctx.lineTo(x, y + 9); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 14, 0, 6.283); ctx.stroke();
      ctx.font = MONO; ctx.fillStyle = 'rgba(34,34,42,.55)'; ctx.fillText(u ? 'PLACE' : 'PICK', x - 14, y + 32);
    }
    for (const d of s.data.demos) {
      const end = Math.min(1, phase * d.speed);
      const path = [];
      for (let i = 0; i <= N; i++) {
        const u = i / N, env = Math.sin(Math.PI * u);
        let [x, y] = this.base(u, s);
        x += d.wx(u) * 22 * d.amp * env;
        y += d.wy(u) * 30 * d.amp * env;
        if (d.fail && u > 0.55) y += (u - 0.55) ** 2 * s.h * 0.9;
        path.push([x, y]);
      }
      const stroke = (pts, style, lw) => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.strokeStyle = style; ctx.lineWidth = lw; ctx.stroke(); };
      stroke(path, d.fail ? 'rgba(175,50,97,.22)' : 'rgba(34,34,42,.07)', 0.8);
      const k = Math.floor(N * end), lo = Math.max(0, k - 28);
      if (k > 0) stroke(path.slice(lo, k + 1), d.fail ? 'rgba(175,50,97,.8)' : 'rgba(34,34,42,.45)', 1);
      if (end > 0 && end < 1) { const [hx, hy] = path[k]; ctx.fillStyle = d.fail ? FAIL : INK; ctx.fillRect(hx - 1.5, hy - 1.5, 3, 3); }
    }
    // mean path, dashed, in the accent
    ctx.setLineDash([2, 5]); ctx.strokeStyle = ACC; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let i = 0; i <= N; i++) { const [x, y] = this.base(i / N, s); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke(); ctx.setLineDash([]);
  }
});

/* 02 · Strata: the real subtask cut, repeated across many episodes. */
setup('strata', {
  init(s, r) {
    const rows = 46;
    const eps = Array.from({ length: rows }, () => {
      let acc = 0;
      const durs = SEGMENTS.map(g => (g.end - g.start) * (0.6 + r() * 0.8));
      const total = durs.reduce((a, b) => a + b, 0);
      return { cuts: durs.map(d => (acc += d) / total), fails: SEGMENTS.map(g => g.fail && r() < 0.18), drift: wobble(r, 2) };
    });
    return { eps };
  },
  draw(ctx, s, t) {
    ctx.fillStyle = GROUND; ctx.fillRect(0, 0, s.w, s.h);
    const L = 28, R = s.w - 28, T = 62, B = s.h - 44, rows = s.data.eps.length, rh = (B - T) / rows;
    const tones = ['#5A5A62', '#8C97A8', '#B9B4A6', '#D9D3C4', '#A7A39A', '#C9C3B5', '#7E7A73', '#E2DCCD'];
    const pts = SEGMENTS.map(() => []);
    s.data.eps.forEach((ep, i) => {
      const y = T + i * rh, sweep = Math.min(1, (t * 0.35 - i * 0.012));
      if (sweep <= 0) return;
      let x0 = L;
      ep.cuts.forEach((c, k) => {
        const cc = Math.min(1, c + ep.drift(t * 0.02 + i * 0.01) * 0.004 * (k < 7));
        const x1 = L + (R - L) * Math.min(cc, sweep);
        if (x1 > x0) {
          ctx.fillStyle = ep.fails[k] ? FAIL : (k === 1 ? ACC : tones[k]);
          ctx.globalAlpha = ep.fails[k] ? 0.9 : (k === 1 ? 0.85 : 0.7);
          ctx.fillRect(x0, y + rh * 0.18, x1 - x0 - 1, rh * 0.64);
          ctx.globalAlpha = 1;
        }
        pts[k].push([L + (R - L) * cc, y + rh / 2]);
        x0 = x1;
      });
    });
    // boundary contours across episodes
    ctx.strokeStyle = 'rgba(34,34,42,.5)'; ctx.lineWidth = 0.7;
    pts.slice(0, 7).forEach(line => { ctx.beginPath(); line.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); });
    ctx.font = MONO; ctx.fillStyle = 'rgba(34,34,42,.55)';
    ctx.fillText('EPISODE 0001 → 0046', L, T - 10);
  }
});

/* 03 · Dot matrix: a 3-joint arm drawn as a halftone grid. */
setup('dotarm', {
  init() { return {}; },
  draw(ctx, s, t) {
    ctx.fillStyle = GROUND; ctx.fillRect(0, 0, s.w, s.h);
    const step = Math.max(7, s.w / 70), base = [s.w * 0.44, s.h * 0.86];
    const L = [s.h * 0.36, s.h * 0.3, s.h * 0.14];
    // pick at left, place at right, in a smooth loop
    // the wrist follows a lift-carry-place arc; the hand points down
    const u = (1 - Math.cos(t * 0.8)) / 2;
    const tx = s.w * (0.18 + 0.56 * u), ty = s.h * (0.6 - 0.32 * Math.sin(Math.PI * u));
    const dx = tx - base[0], dy = base[1] - ty, D = Math.min(Math.hypot(dx, dy), L[0] + L[1] - 1);
    const c2 = (D * D - L[0] * L[0] - L[1] * L[1]) / (2 * L[0] * L[1]);
    const q2 = Math.sign(dx || 1) * Math.acos(Math.max(-1, Math.min(1, c2)));
    const q1 = Math.atan2(dx, dy) - Math.atan2(L[1] * Math.sin(q2), L[0] + L[1] * Math.cos(q2));
    const q = [q1, q2, Math.PI - q1 - q2];
    const J = [base]; let a = 0;
    q.forEach((qi, i) => { a += qi; const [x, y] = J[i]; J.push([x + L[i] * Math.sin(a), y - L[i] * Math.cos(a)]); });
    const segD = (px, py, [ax, ay], [bx, by]) => {
      const dx = bx - ax, dy = by - ay, k = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
      return Math.hypot(px - ax - k * dx, py - ay - k * dy);
    };
    const thick = [step * 2.2, step * 1.7, step * 1.2];
    const obj = [tx - s.w * 0.04, J[3][1] + step * 0.6, s.w * 0.08, s.h * 0.08];
    for (let y = step / 2; y < s.h; y += step) for (let x = step / 2; x < s.w; x += step) {
      let v = 0;
      for (let i = 0; i < 3; i++) v = Math.max(v, 1 - segD(x, y, J[i], J[i + 1]) / thick[i]);
      for (const j of J) v = Math.max(v, 1 - Math.hypot(x - j[0], y - j[1]) / (step * 2.6));
      const inObj = x > obj[0] && x < obj[0] + obj[2] && y > obj[1] && y < obj[1] + obj[3];
      if (y > s.h * 0.86 && y < s.h * 0.9) v = Math.max(v, 0.22);
      if (inObj) { ctx.strokeStyle = ACC; ctx.lineWidth = 1.2; ctx.strokeRect(x - step * 0.3, y - step * 0.3, step * 0.6, step * 0.6); continue; }
      if (v <= 0.02) continue;
      ctx.fillStyle = INK; ctx.fillRect(x - step * 0.42 * v, y - step * 0.42 * v, step * 0.84 * v, step * 0.84 * v);
    }
    // joint labels and hairlines
    ctx.font = MONO; ctx.strokeStyle = 'rgba(34,34,42,.5)'; ctx.lineWidth = 0.7;
    J.slice(0, 3).forEach(([x, y], i) => {
      const lx = x + 40 + i * 10, ly = y - 30;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(lx, ly); ctx.lineTo(lx + 64, ly); ctx.stroke();
      ctx.fillStyle = INK; ctx.fillText(`J${i + 1} ${(q[i] * 57.3).toFixed(1).padStart(6)}°`, lx + 2, ly - 5);
    });
    const [ex, ey] = J[3];
    ctx.strokeStyle = ACC; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(ex, ey, step * 1.6, 0, 6.283); ctx.stroke();
  }
});

/* 04 · Keypoints: a 21-joint hand closing on an object. */
setup('hand', {
  init() { return { trail: [] }; },
  // Authored keypoints, wrist at the origin, hand height = 1. MediaPipe order.
  OPEN: [[0,0],[-.18,-.1],[-.3,-.22],[-.38,-.34],[-.44,-.44],[-.12,-.45],[-.14,-.62],[-.15,-.74],[-.16,-.84],[0,-.47],[0,-.66],[0,-.79],[0,-.9],[.11,-.44],[.13,-.61],[.14,-.73],[.15,-.82],[.21,-.38],[.25,-.5],[.27,-.59],[.29,-.67]],
  SHUT: [[0,0],[-.16,-.1],[-.25,-.22],[-.22,-.34],[-.13,-.4],[-.12,-.45],[-.15,-.6],[-.1,-.57],[-.07,-.5],[0,-.47],[0,-.63],[.03,-.58],[.03,-.5],[.11,-.44],[.13,-.58],[.13,-.52],[.11,-.46],[.21,-.38],[.24,-.47],[.22,-.42],[.19,-.38]],
  pose(g, s) {
    const k = s.h * 0.8, cx = s.w * 0.5, cy = s.h * 0.9;
    return this.OPEN.map(([x, y], i) => {
      const [x2, y2] = this.SHUT[i];
      // fingers close one after another, index first
      const f = i < 5 ? 0 : Math.floor((i - 1) / 4) - 1, gg = Math.max(0, Math.min(1, g * 1.3 - f * 0.08));
      return [cx + (x + (x2 - x) * gg) * k, cy + (y + (y2 - y) * gg) * k];
    });
  },
  draw(ctx, s, t) {
    ctx.fillStyle = GROUND; ctx.fillRect(0, 0, s.w, s.h);
    const g = (1 - Math.cos(t * 1.1)) / 2;
    const P = this.pose(g, s).map(([x, y]) => [x + Math.sin(t * 0.55) * s.w * 0.06, y + Math.cos(t * 0.4) * s.h * 0.015]);
    const tr = s.data.trail; tr.push(P); if (tr.length > 34) tr.shift();
    const bones = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]];
    // object
    // ghost frames
    tr.forEach((F, n) => {
      if (n % 5) return;
      ctx.strokeStyle = `rgba(34,34,42,${0.04 + 0.1 * n / tr.length})`; ctx.lineWidth = 0.8; ctx.beginPath();
      bones.forEach(([a, b]) => { ctx.moveTo(...F[a]); ctx.lineTo(...F[b]); }); ctx.stroke();
    });
    // fingertip trails
    [4, 8, 12, 16, 20].forEach(k => {
      ctx.strokeStyle = 'rgba(239,183,2,.9)'; ctx.lineWidth = 1.4; ctx.beginPath();
      tr.forEach((F, n) => n ? ctx.lineTo(...F[k]) : ctx.moveTo(...F[k])); ctx.stroke();
    });
    ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.beginPath();
    bones.forEach(([a, b]) => { ctx.moveTo(...P[a]); ctx.lineTo(...P[b]); }); ctx.stroke();
    P.forEach(([x, y], i) => {
      ctx.fillStyle = [4, 8, 12, 16, 20].includes(i) ? ACC : GROUND; ctx.strokeStyle = INK; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, i ? 3 : 4.5, 0, 6.283); ctx.fill(); ctx.stroke();
    });
    // registration marks
    ctx.strokeStyle = 'rgba(34,34,42,.4)';
    [[22, 22], [s.w - 22, 22], [22, s.h - 22], [s.w - 22, s.h - 22]].forEach(([x, y]) => {
      ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y); ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 6); ctx.stroke();
    });
    ctx.font = MONO; ctx.fillStyle = INK;
    ctx.fillText(`GRIP ${(g * 100).toFixed(0).padStart(3)}%`, s.w - 104, s.h - 40);
  }
});

/* 05 · Contact field: particles flow toward grasp points. */
setup('field', {
  init(s, r) {
    const n = noise2(r);
    const grasps = [[0.3, 0.38], [0.68, 0.32], [0.52, 0.7]].map(([x, y]) => [x * s.w + (r() - 0.5) * 30, y * s.h + (r() - 0.5) * 30]);
    const ps = Array.from({ length: 900 }, () => ({ x: r() * s.w, y: r() * s.h, life: r() * 200 }));
    return { n, grasps, ps, r, fresh: true };
  },
  draw(ctx, s, t) {
    const d = s.data;
    if (d.fresh) { ctx.fillStyle = GROUND; ctx.fillRect(0, 0, s.w, s.h); d.fresh = false; }
    ctx.fillStyle = 'rgba(245,242,235,.06)'; ctx.fillRect(0, 0, s.w, s.h);
    ctx.lineWidth = 0.7;
    for (const p of d.ps) {
      const a = d.n(p.x * 0.006, p.y * 0.006 + t * 0.05) * 12.6;
      let vx = Math.cos(a), vy = Math.sin(a);
      // pull toward the nearest grasp point
      let best = null, bd = 1e9;
      for (const g of d.grasps) { const dd = Math.hypot(g[0] - p.x, g[1] - p.y); if (dd < bd) { bd = dd; best = g; } }
      const pull = Math.min(1, 60 / bd);
      vx = vx * (1 - pull) + (best[0] - p.x) / bd * pull * 1.4;
      vy = vy * (1 - pull) + (best[1] - p.y) / bd * pull * 1.4;
      const nx = p.x + vx * 1.3, ny = p.y + vy * 1.3;
      ctx.strokeStyle = bd < 40 ? 'rgba(239,183,2,.7)' : 'rgba(34,34,42,.32)';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nx, ny); ctx.stroke();
      p.x = nx; p.y = ny; p.life--;
      if (p.life < 0 || bd < 4 || p.x < 0 || p.y < 0 || p.x > s.w || p.y > s.h) { p.x = d.r() * s.w; p.y = d.r() * s.h; p.life = 120 + d.r() * 200; }
    }
    ctx.font = MONO;
    d.grasps.forEach(([x, y], i) => {
      ctx.fillStyle = GROUND; ctx.fillRect(x - 46, y + 14, 92, 16);
      ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, 6, 0, 6.283); ctx.stroke();
      ctx.fillStyle = INK; ctx.fillText(`GRASP_${i + 1}`, x - 26, y + 26);
    });
  }
});

/* 06 · Halftone: the real hero clip, with its real annotation. */
{
  const vid = document.getElementById('src');
  const label = document.getElementById('ht-step');
  setup('halftone', {
    init() { vid.play().catch(() => {}); return { last: 0 }; },
    draw(ctx, s, t) {

      s.data.last = t;
      const cv = ctx.canvas;
      ctx.setTransform(1, 0, 0, 1, 0, 0);

/* 07 · Ridges: velocity profiles, back to front, each one hides the one behind. */
setup('ridges', {
  init(s, r) {
    const eps = Array.from({ length: 40 }, () => {
      const jit = SEGMENTS.map(() => (r() - 0.5) * 0.6);
      const amp = SEGMENTS.map(() => 0.4 + r() * 0.8);
      return { jit, amp, w: wobble(r, 5) };
    });
    return { eps };
  },
  speed(ep, u) {
    // a bump at every subtask change: the arm moves fast between steps
    let v = 0.06 + 0.03 * ep.w(u * 3);
    SEGMENTS.forEach((g, k) => {
      const c = (g.end + ep.jit[k]) / 19, d = (u - c) / 0.022;
      v += ep.amp[k] * Math.exp(-d * d);
    });
    return v;
  },
  draw(ctx, s, t) {
    ctx.fillStyle = GROUND; ctx.fillRect(0, 0, s.w, s.h);
    const n = s.data.eps.length, L = s.w * 0.18, R = s.w * 0.82, T = s.h * 0.26, B = s.h * 0.9;
    const gap = (B - T) / n, N = 160, hero = 24;
    for (let i = 0; i < n; i++) {
      const ep = s.data.eps[i], y0 = T + i * gap;
      ctx.beginPath(); ctx.moveTo(L, y0);
      for (let j = 0; j <= N; j++) {
        const u = j / N, x = L + (R - L) * u;
        const lift = this.speed(ep, (u + t * 0.015) % 1) * gap * 2.6 * Math.sin(Math.PI * u) ** 0.6;
        ctx.lineTo(x, y0 - lift);
      }
      ctx.lineTo(R, y0); ctx.closePath();
      ctx.fillStyle = GROUND; ctx.fill();
      ctx.strokeStyle = i === hero ? ACC : INK; ctx.lineWidth = i === hero ? 1.8 : 0.9; ctx.stroke();
    }
  }
});

/* 08 · Fold: a cloth mesh folded twice, in perspective. */
setup('cloth', {
  init(s, r) { return { wr: Array.from({ length: 6 }, () => [r() * 6, r() * 6, r() * 6.28]) }; },
  draw(ctx, s, t) {
    ctx.fillStyle = GROUND; ctx.fillRect(0, 0, s.w, s.h);
    const C = 30, Rr = 20, cyc = 9, p = (t % cyc) / cyc;
    const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
    // timeline: fold 1, fold 2, hold, open both
    const a1 = Math.PI * (ease((p - 0.05) / 0.25) - ease((p - 0.8) / 0.15));
    const a2 = Math.PI * (ease((p - 0.35) / 0.25) - ease((p - 0.72) / 0.1));
    document.getElementById('cloth-step').textContent = p < 0.32 ? 'fold 1 · left over right' : p < 0.66 ? 'fold 2 · bottom over top' : p < 0.72 ? 'hold' : 'reset';
    const pts = [];
    for (let j = 0; j <= Rr; j++) { const row = []; for (let i = 0; i <= C; i++) {
      let x = i / C * 2 - 1, y = (j / Rr * 2 - 1) * 0.66, z = 0;
      for (const [fx, fy, ph] of s.data.wr) z += 0.012 * Math.sin(fx * x + fy * y + ph);
      let moved = 0;
      if (x < 0) { const c = Math.cos(a1), sn = Math.sin(a1); [x, z] = [x * c - z * sn * -1, -x * sn + z * c]; z += 0.01 * Math.sin(a1); moved = a1 > 0.01 && a1 < 3.13 ? 1 : 0; }
      if (y > 0) { const c = Math.cos(a2), sn = Math.sin(a2); [y, z] = [y * c - z * sn, y * sn + z * c]; z = Math.abs(z) + 0.02 * Math.sin(a2); moved = moved || (a2 > 0.01 && a2 < 3.13 ? 2 : 0); }
      row.push({ x, y, z, moved });
    } pts.push(row); }
    // view: tilt the table toward the camera
    const pitch = 0.8, yaw = -0.3 + Math.sin(t * 0.2) * 0.1, f = 3.2, sc = Math.min(s.w, s.h * 1.5) * 0.5;
    const proj = ({ x, y, z }) => {
      const x1 = x * Math.cos(yaw) - y * Math.sin(yaw), y1 = x * Math.sin(yaw) + y * Math.cos(yaw);
      const y2 = y1 * Math.cos(pitch) - z * Math.sin(pitch), z2 = y1 * Math.sin(pitch) + z * Math.cos(pitch);
      const k = f / (f + z2 * -1 + 1.2);
      return [x1 * sc * k, y2 * sc * k];
    };
    let P = pts.map(row => row.map(proj));
    const all = P.flat(), mx = all.reduce((a, q) => a + q[0], 0) / all.length, my = all.reduce((a, q) => a + q[1], 0) / all.length;
    s.data.c = s.data.c ? [s.data.c[0] * 0.9 + mx * 0.1, s.data.c[1] * 0.9 + my * 0.1] : [mx, my];
    P = P.map(row => row.map(([x, y]) => [x - s.data.c[0] + s.w / 2, y - s.data.c[1] + s.h / 2]));
    const line = (a, b, m) => { ctx.strokeStyle = m ? 'rgba(239,183,2,.95)' : 'rgba(34,34,42,.42)'; ctx.lineWidth = m ? 1.1 : 0.7; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); };
    for (let j = 0; j <= Rr; j++) for (let i = 0; i < C; i++) line(P[j][i], P[j][i + 1], pts[j][i].moved && pts[j][i + 1].moved);
    for (let i = 0; i <= C; i++) for (let j = 0; j < Rr; j++) line(P[j][i], P[j + 1][i], pts[j][i].moved && pts[j + 1][i].moved);
  }
});

/* 09 · Rings: one ring per episode, one arc per subtask. */
setup('rings', {
  init(s, r) {
    const rings = Array.from({ length: 28 }, () => {
      const d = SEGMENTS.map(g => (g.end - g.start) * (0.6 + r() * 0.8)), tot = d.reduce((a, b) => a + b, 0);
      return { d: d.map(x => x / tot), fail: SEGMENTS.map(g => g.fail && r() < 0.2), off: r() * 0.08 };
    });
    return { rings };
  },
  draw(ctx, s, t) {
    ctx.fillStyle = GROUND; ctx.fillRect(0, 0, s.w, s.h);
    const cx = s.w / 2, cy = s.h / 2, r0 = s.h * 0.08, r1 = s.h * 0.44, n = s.data.rings.length, dr = (r1 - r0) / n;
    const tones = ['#5A5A62', ACC, '#8C97A8', '#B9B4A6', '#7E7A73', '#C9C3B5', '#5A5A62', '#D9D3C4'];
    const sweep = (t * 0.25) % 6.283 - Math.PI / 2;
    s.data.rings.forEach((rg, i) => {
      let a = -Math.PI / 2 + rg.off * 6.283;
      const rad = r0 + i * dr + dr / 2;
      rg.d.forEach((f, k) => {
        const a2 = a + f * 6.283;
        ctx.strokeStyle = rg.fail[k] ? FAIL : tones[k]; ctx.lineWidth = dr * 0.62;
        ctx.globalAlpha = k === 1 || rg.fail[k] ? 0.95 : 0.75;
        ctx.beginPath(); ctx.arc(cx, cy, rad, a + 0.012, a2 - 0.012); ctx.stroke();
        a = a2;
      });
    });
    ctx.globalAlpha = 1;
    ctx.strokeStyle = INK; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(sweep) * r0 * 0.6, cy + Math.sin(sweep) * r0 * 0.6); ctx.lineTo(cx + Math.cos(sweep) * (r1 + 10), cy + Math.sin(sweep) * (r1 + 10)); ctx.stroke();
    ctx.font = MONO; ctx.fillStyle = INK; ctx.textAlign = 'center';
    ctx.fillText('n = ' + n, cx, cy + 4); ctx.textAlign = 'left';
  }
});

/* 10 · Long exposure: two arms paint light on a dark ground. */
setup('exposure', {
  init(s, r) {
    const grain = document.createElement('canvas'); grain.width = 256; grain.height = 256;
    const g = grain.getContext('2d'), im = g.createImageData(256, 256);
    for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 14; }
    g.putImageData(im, 0, 0);
    return { arms: [0, 1].map(() => ({ wx: wobble(r, 5), wy: wobble(r, 5) })), grain, fresh: true, last: null };
  },
  draw(ctx, s, t) {
    const d = s.data;
    if (d.fresh) { ctx.fillStyle = '#121216'; ctx.fillRect(0, 0, s.w, s.h); ctx.fillStyle = ctx.createPattern(d.grain, 'repeat'); ctx.fillRect(0, 0, s.w, s.h); d.fresh = false; }
    ctx.globalCompositeOperation = 'source-over';
    if (((t * 60) | 0) % 4 === 0) { ctx.fillStyle = 'rgba(18,18,22,.02)'; ctx.fillRect(0, 0, s.w, s.h); }
    ctx.globalCompositeOperation = 'lighter';
    const pos = d.arms.map((a, i) => {
      const side = i ? 1 : -1, u = t * 0.9;
      return [s.w / 2 + side * s.w * (0.2 + 0.1 * Math.sin(u * 1.3 + i)) + a.wx(u * 0.07) * s.w * 0.12,
              s.h * 0.52 + Math.sin(u * 2 + i * 1.7) * s.h * 0.22 + a.wy(u * 0.05) * s.h * 0.12];
    });
    if (d.last) pos.forEach((p, i) => {
      ctx.strokeStyle = i ? 'rgba(239,183,2,.45)' : 'rgba(245,242,235,.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(...d.last[i]); ctx.lineTo(...p); ctx.stroke();
    });
    d.last = pos;
    ctx.globalCompositeOperation = 'source-over';
  }
});

/* 11 · Type: the clip drawn with the letters of its current subtask. */
{
  const vid = document.getElementById('src');
  const read = document.createElement('canvas'), rc = read.getContext('2d', { willReadFrequently: true });
  setup('typefield', {
    init() { vid.play().catch(() => {}); return { last: 0 }; },
    draw(ctx, s, t) {
      if (t - s.data.last < 1 / 15 || vid.readyState < 2) return;
      s.data.last = t;
      const cw = 7, ch = 10, gw = Math.floor(s.w / cw), gh = Math.floor(s.h / ch);
      read.width = gw; read.height = gh;
      const iw = vid.videoWidth, ih = vid.videoHeight, dr = s.w / s.h, sw = Math.min(iw, ih * dr);
      rc.drawImage(vid, (iw - sw) / 2, 0, sw, ih, 0, 0, gw, gh);
      const px = rc.getImageData(0, 0, gw, gh).data;
      const seg = SEGMENTS.find(g => vid.currentTime < g.end) || SEGMENTS[7];
      const word = seg.label.toUpperCase().replace(/ /g, '·') + '·';
      ctx.fillStyle = GROUND; ctx.fillRect(0, 0, s.w, s.h);
      ctx.font = '500 9px "IBM Plex Mono", monospace';
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
        const i = (y * gw + x) * 4, l = (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]) / 255;
        const v = Math.min(1, Math.max(0, (l - 0.42) / 0.38));
        if (v < 0.1) continue;
        ctx.fillStyle = seg.fail && v > 0.75 ? `rgba(175,50,97,${v})` : `rgba(34,34,42,${v * 0.95})`;
        ctx.fillText(word[(x + y * 3) % word.length], x * cw, y * ch + 8);
      }
    }
  });
}

/* 11b · Type, full frame, with a subtask strip that seeks the clip. */
{
  const vid = document.getElementById('src');
  const read = document.createElement('canvas'), rc = read.getContext('2d', { willReadFrequently: true });
  const strip = document.getElementById('tw-strip'), stepEl = document.getElementById('tw-step');
  const cells = SEGMENTS.map(g => {
    const el = document.createElement('span');
    el.style.flex = String(g.end - g.start); el.textContent = g.label; el.title = g.label;
    if (g.fail) el.classList.add('fail');
    el.appendChild(document.createElement('i'));
    el.addEventListener('click', e => { e.stopPropagation(); vid.currentTime = g.start + 0.01; vid.play(); });
    strip.appendChild(el); return el;
  });
  setup('typewide', {
    init() { vid.play().catch(() => {}); return { last: 0 }; },
    draw(ctx, s, t) {
      if (t - s.data.last < 1 / 20 || vid.readyState < 2) return;
      s.data.last = t;
      const cw = Math.max(5, s.w / 200), ch = cw * 1.4, gw = Math.floor(s.w / cw), gh = Math.floor(s.h / ch);
      read.width = gw; read.height = gh;
      rc.drawImage(vid, 0, 0, gw, gh);
      const px = rc.getImageData(0, 0, gw, gh).data;
      const k = SEGMENTS.findIndex(g => vid.currentTime < g.end), seg = SEGMENTS[k < 0 ? 7 : k];
      const word = seg.label.toUpperCase().replace(/ /g, '·') + '·';
      ctx.fillStyle = GROUND; ctx.fillRect(0, 0, s.w, s.h);
      ctx.font = `500 ${(cw * 1.3).toFixed(1)}px "IBM Plex Mono", monospace`;
      for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
        const i = (y * gw + x) * 4, l = (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]) / 255;
        const v = Math.min(1, Math.max(0, (l - 0.36) / 0.42));
        if (v < 0.08) continue;
        ctx.fillStyle = seg.fail && v > 0.75 ? `rgba(175,50,97,${v})` : `rgba(34,34,42,${0.15 + v * 0.85})`;
        ctx.fillText(word[(x + y * 3) % word.length], x * cw, y * ch + ch * 0.8);
      }
      stepEl.textContent = seg.label; stepEl.style.color = seg.fail ? FAIL : '';
      cells.forEach((el, j) => {
        const g = SEGMENTS[j], on = g === seg;
        el.classList.toggle('on', on);
        el.querySelector('i').style.width = on ? `${100 * (vid.currentTime - g.start) / (g.end - g.start)}%` : '0';
      });
    }
  });
}

/* 12 · Contours: success rate over object position and angle. */
setup('contours', {
  init(s, r) {
    const hills = Array.from({ length: 5 }, () => ({ x: 0.2 + r() * 0.6, y: 0.2 + r() * 0.6, sx: 0.12 + r() * 0.15, sy: 0.12 + r() * 0.15, a: 0.5 + r() * 0.5, ph: r() * 6.28 }));
    const trials = Array.from({ length: 140 }, () => ({ x: r(), y: r(), roll: r() }));
    return { hills, trials };
  },
  f(x, y, t) {
    let v = 0;
    for (const h of this.hillsNow) { const dx = (x - h.x - 0.03 * Math.sin(t * 0.3 + h.ph)) / h.sx, dy = (y - h.y - 0.03 * Math.cos(t * 0.25 + h.ph)) / h.sy; v += h.a * Math.exp(-(dx * dx + dy * dy)); }
    return Math.min(1, v);
  },
  draw(ctx, s, t) {
    this.hillsNow = s.data.hills;
    ctx.fillStyle = GROUND; ctx.fillRect(0, 0, s.w, s.h);
    const pad = 36, W = s.w - 2 * pad, H = s.h - 2 * pad, gx = 90, gy = Math.round(90 * H / W);
    const F = []; for (let j = 0; j <= gy; j++) { F.push([]); for (let i = 0; i <= gx; i++) F[j].push(this.f(i / gx, j / gy, t)); }
    const X = i => pad + i / gx * W, Y = j => pad + j / gy * H;
    for (let lv = 1; lv <= 9; lv++) {
      const L = lv / 10;
      ctx.strokeStyle = lv === 9 ? ACC : `rgba(34,34,42,${0.18 + lv * 0.04})`; ctx.lineWidth = lv === 9 ? 2 : 0.8;
      ctx.beginPath();
      for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++) {
        const a = F[j][i], b = F[j][i + 1], c = F[j + 1][i + 1], d = F[j + 1][i];
        const e = [];
        const cut = (p, q, x1, y1, x2, y2) => { if ((p < L) !== (q < L)) { const k = (L - p) / (q - p); e.push([X(x1 + (x2 - x1) * k), Y(y1 + (y2 - y1) * k)]); } };
        cut(a, b, i, j, i + 1, j); cut(b, c, i + 1, j, i + 1, j + 1); cut(d, c, i, j + 1, i + 1, j + 1); cut(a, d, i, j, i, j + 1);
        for (let k = 0; k + 1 < e.length; k += 2) { ctx.moveTo(...e[k]); ctx.lineTo(...e[k + 1]); }
      }
      ctx.stroke();
    }
    for (const tr of s.data.trials) {
      const x = pad + tr.x * W, y = pad + tr.y * H, ok = tr.roll < this.f(tr.x, tr.y, t);
      if (ok) { ctx.fillStyle = INK; ctx.fillRect(x - 1.5, y - 1.5, 3, 3); }
      else { ctx.strokeStyle = FAIL; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - 3, y - 3); ctx.lineTo(x + 3, y + 3); ctx.moveTo(x + 3, y - 3); ctx.lineTo(x - 3, y + 3); ctx.stroke(); }
    }
    ctx.strokeStyle = 'rgba(34,34,42,.3)'; ctx.lineWidth = 1; ctx.strokeRect(pad, pad, W, H);
  }
});
</script>
