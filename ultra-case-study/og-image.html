<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shotwell x Ultra OG Image</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: #d7c7a9;
      color: #201c17;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      position: relative;
      display: grid;
      align-content: center;
      width: 1116px;
      height: 546px;
      padding: 54px 48px;
      border: 2px solid #3d3428;
      background: #efe5ce;
    }
    .logos {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-bottom: 48px;
    }
    .shotwell {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #201c17;
      font-size: 45px;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1;
      letter-spacing: -.04em;
    }
    .shotwell img { width: 40px; height: 60px; object-fit: contain; }
    .divider {
      color: #9b3328;
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
    }
    .ultra { width: 322px; height: auto; mix-blend-mode: multiply; }
    .kicker {
      margin: 0 0 20px;
      color: #9b3328;
      text-transform: uppercase;
      letter-spacing: .15em;
      font-size: 17px;
      font-weight: 800;
    }
    h1 {
      max-width: 1040px;
      margin: 0;
      font-size: 80px;
      line-height: .94;
      letter-spacing: -.055em;
    }
    h1 span { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <section>
      <div class="logos" aria-label="Shotwell and Ultra">
        <div class="shotwell">
          <img src="../shotwell-logo.png" alt="">
          <span>Shotwell.</span>
        </div>
        <div class="divider" aria-hidden="true">×</div>
        <img class="ultra" src="../ultra-logo.png" alt="Ultra">
      </div>
      <p class="kicker">Case study</p>
      <h1><span>Turning robot teleoperation</span><span>data into reliable training data</span></h1>
    </section>
  </main>
</body>
</html>
